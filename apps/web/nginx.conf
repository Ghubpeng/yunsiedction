# 生产 Web nginx 配置（apps/web/nginx.conf，由 Dockerfile 装配）
#   - / → React 静态文件（SPA history fallback）
#   - /api/ → 反代 Spring Boot（不缓存；404 不回退 index.html）
#   - 上传接口保持 500MB 能力（与后端 multipart 配置一致，禁止缩小）
#   - 静态资源：带 hash 的 assets 长缓存；index.html 不缓存
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物（带内容 hash）：长缓存 + immutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口文件不缓存（保证发版后前端及时更新）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反向代理：不缓存任何 API 响应；错误原样返回（404 为 JSON，不回退 index.html）
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 视频上传/长请求超时放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 课程视频上传能力（与后端 spring.servlet.multipart 500MB 一致）
        client_max_body_size 500m;
        add_header Cache-Control "no-store";
    }

    # SPA history fallback：仅文件不存在时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
